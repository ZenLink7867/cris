<!-- ABA BESTIÁRIO PARANORMAL -->
<div id="bestiario" class="tab-content">
    <h2 class="section-title">BESTIÁRIO PARANORMAL</h2>
    
    <!-- BARRA DE BUSCA E BOTÃO FILTROS -->
    <div class="search-box-container">
        <div class="search-input-wrapper">
            <label for="search-creature">BUSCAR ENTIDADE (NOME, HISTÓRIA, ATRIBUTOS...)</label>
            <input type="text" id="search-creature" placeholder="Digite qualquer termo (ex: cadáveres, garras, energia)..." oninput="filtrarBestiario()">
        </div>
        <button type="button" class="btn-filtros-toggle" onclick="toggleFiltros()">
            <span>⚙ FILTROS</span>
        </button>
    </div>

    <!-- PAINEL DE FILTROS AVANÇADOS -->
    <div id="painel-filtros" class="painel-filtros">
        <div class="filtros-grid">
            <!-- ELEMENTOS -->
            <div class="filtro-grupo" data-filtro="elementos">
                <h4>ELEMENTO</h4>
                <label class="chk-container"><input type="checkbox" value="sangue" onchange="filtrarBestiario()"> Sangue</label>
                <label class="chk-container"><input type="checkbox" value="morte" onchange="filtrarBestiario()"> Morte</label>
                <label class="chk-container"><input type="checkbox" value="energia" onchange="filtrarBestiario()"> Energia</label>
                <label class="chk-container"><input type="checkbox" value="conhecimento" onchange="filtrarBestiario()"> Conhecimento</label>
                <label class="chk-container"><input type="checkbox" value="medo" onchange="filtrarBestiario()"> Medo</label>
            </div>

            <!-- PERIGO (CATEGORIAS ATUALIZADAS) -->
            <div class="filtro-grupo" data-filtro="perigo">
                <h4>PERIGO</h4>
                <label class="chk-container"><input type="checkbox" value="alto" onchange="filtrarBestiario()"> Alto</label>
                <label class="chk-container"><input type="checkbox" value="letal" onchange="filtrarBestiario()"> Letal</label>
                <label class="chk-container"><input type="checkbox" value="critico" onchange="filtrarBestiario()"> Crítico</label>
                <label class="chk-container"><input type="checkbox" value="extremo" onchange="filtrarBestiario()"> Extremo</label>
                <label class="chk-container"><input type="checkbox" value="terminal" onchange="filtrarBestiario()"> Terminal</label>
            </div>

            <!-- TIPO DE SER -->
            <div class="filtro-grupo" data-filtro="tipo">
                <h4>TIPO DE SER</h4>
                <label class="chk-container"><input type="checkbox" value="criatura" onchange="filtrarBestiario()"> Criatura</label>
                <label class="chk-container"><input type="checkbox" value="pessoa" onchange="filtrarBestiario()"> Pessoa / Cultista</label>
                <label class="chk-container"><input type="checkbox" value="reliquia" onchange="filtrarBestiario()"> Relíquia</label>
                <label class="chk-container"><input type="checkbox" value="objeto" onchange="filtrarBestiario()"> Objeto Amaldiçoado</label>
            </div>

            <!-- TAMANHO -->
            <div class="filtro-grupo" data-filtro="tamanho">
                <h4>TAMANHO</h4>
                <label class="chk-container"><input type="checkbox" value="pequeno" onchange="filtrarBestiario()"> Pequeno</label>
                <label class="chk-container"><input type="checkbox" value="medio" onchange="filtrarBestiario()"> Médio</label>
                <label class="chk-container"><input type="checkbox" value="grande" onchange="filtrarBestiario()"> Grande</label>
                <label class="chk-container"><input type="checkbox" value="enorme" onchange="filtrarBestiario()"> Enorme</label>
                <label class="chk-container"><input type="checkbox" value="colossal" onchange="filtrarBestiario()"> Colossal</label>
            </div>
        </div>
    </div>

    <!-- GRID DE CARDS -->
    <div id="grid-bestiario" class="grid-bestiario">
        <p style="color: var(--cris-green);">Carregando ameaças do banco de dados...</p>
    </div>
</div>
