<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.R.I.S. - TERMINAL DE ACESSO</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cris-green: #00ff66;
            --cris-glow: rgba(0, 255, 102, 0.4);
            --cris-dark: #080d0a;
            --cris-panel: #0d1712;
            --cris-border: #1b3d29;
        }

        /* Oculta o cursor nativo */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none !important;
        }

        body {
            background-color: var(--cris-dark);
            color: var(--cris-green);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- CURSOR GLITCH RETRÔ --- */
        #glitch-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 26px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(0, 0);
        }

        /* Desenho do cursor pixelizado com falhas/pixels faltando */
        .cursor-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 4px var(--cris-green));
            animation: cursorGlitch 4s infinite ease-in-out;
        }

        @keyframes cursorGlitch {
            0%, 92%, 100% {
                transform: translate(0, 0);
                filter: drop-shadow(0 0 4px var(--cris-green));
            }
            93% {
                transform: translate(-2px, 1px);
                filter: drop-shadow(-3px 0 #ff0055) drop-shadow(3px 0 #00ffff);
            }
            95% {
                transform: translate(2px, -1px) scaleY(0.8);
                opacity: 0.6;
            }
            97% {
                transform: translate(-1px, 0);
                filter: drop-shadow(0 0 6px var(--cris-green));
                opacity: 1;
            }
        }

        /* Efeito CRT - Linhas estáticas de fundo */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Vignette nos Cantos */
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.9) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* TERMINAL CONTAINER */
        .terminal-container {
            width: 420px;
            background: var(--cris-panel);
            border: 2px solid var(--cris-green);
            box-shadow: 0 0 25px var(--cris-glow), inset 0 0 15px rgba(0,255,102,0.1);
            border-radius: 4px;
            z-index: 2;
            position: relative;
            overflow: hidden;
        }

        /* Overlay de Textura em Rolagem Infinita (Loop contínuo das linhas) */
        .terminal-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 255, 102, 0.08) 3px,
                rgba(0, 0, 0, 0.25) 4px
            );
            background-size: 100% 8px;
            pointer-events: none;
            z-index: 8;
            animation: scrollTexture 1.5s linear infinite;
        }

        @keyframes scrollTexture {
            0% { background-position-y: 0px; }
            100% { background-position-y: 32px; }
        }

        /* --- GLITCH ESTILO VHS (Fatiamento de estática sem mover a caixa) --- */
        .terminal-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            border: inherit;
            pointer-events: none;
            z-index: 9;
            opacity: 0;
        }

        .terminal-container {
            animation: vhsGlitch 7s infinite ease-in-out;
        }

        @keyframes vhsGlitch {
            0%, 91%, 100% {
                box-shadow: 0 0 25px var(--cris-glow), inset 0 0 15px rgba(0,255,102,0.1);
                filter: none;
            }
            92% {
                /* Aberração Cromática VHS (RGB Split) */
                filter: drop-shadow(-3px 0 0 rgba(255, 0, 80, 0.7)) drop-shadow(3px 0 0 rgba(0, 255, 255, 0.7));
                clip-path: inset(20% 0 60% 0);
            }
            93% {
                clip-path: inset(55% 0 10% 0);
                filter: drop-shadow(4px 0 0 rgba(255, 0, 80, 0.8));
            }
            94% {
                clip-path: inset(80% 0 5% 0);
                filter: drop-shadow(-2px 0 0 rgba(0, 255, 255, 0.8));
            }
            95% {
                clip-path: none;
                filter: none;
            }
        }

        .terminal-header {
            background: rgba(0, 255, 102, 0.15);
            border-bottom: 2px solid var(--cris-green);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
            position: relative;
            z-index: 3;
        }

        .terminal-header h1 {
            font-size: 1.1rem;
            text-shadow: 0 0 8px var(--cris-glow);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--cris-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cris-green);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .terminal-body {
            padding: 30px 25px;
            position: relative;
            z-index: 3;
        }

        .sub-header {
            font-size: 0.85rem;
            color: #7baf92;
            margin-bottom: 25px;
            border-left: none;
            padding-left: 0;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--cris-border);
            border-left: 3px solid var(--cris-green);
            color: #fff;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--cris-green);
            box-shadow: 0 0 10px var(--cris-glow);
        }

        button {
            width: 100%;
            background: var(--cris-green);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            font-family: inherit;
            letter-spacing: 2px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        .msg-status {
            margin-top: 15px;
            font-size: 0.85rem;
            min-height: 20px;
            text-align: center;
        }

        .footer-note {
            border-top: 1px solid var(--cris-border);
            padding: 10px;
            font-size: 0.7rem;
            color: #4a755d;
            text-align: center;
            position: relative;
            z-index: 3;
        }
    </style>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
    <!-- ELEMENTO DO CURSOR CUSTOMIZADO COM GLITCH -->
    <div id="glitch-cursor">
        <svg class="cursor-svg" viewBox="0 0 20 26" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <!-- Seta retro pixelizada com falhas/pixels vazios intencionais -->
            <path fill="#00ff66" d="
                M 0 0 H 2 V 2 H 0 Z
                M 0 2 H 4 V 4 H 0 Z
                M 0 4 H 2 V 6 H 4 V 6 H 6 Z
                M 0 6 H 8 V 8 H 0 Z
                M 0 8 H 6 V 10 H 10 Z
                M 0 10 H 4 V 12 H 8 V 12 H 12 Z
                M 0 12 H 14 V 14 H 0 Z
                M 0 14 H 6 V 16 H 10 V 16 H 16 Z
                M 0 16 H 12 V 18 H 0 Z
                M 0 18 H 4 V 20 H 8 V 20 H 10 Z
                M 0 20 H 2 V 22 H 6 Z
                M 0 22 H 4 V 24 Z
                M 4 18 H 6 V 26 H 4 Z
            "/>
            <!-- Pixel solto/deslocado para dar impressão de artefato de sinal -->
            <rect x="16" y="4" width="2" height="2" fill="#00ff66" opacity="0.8"/>
            <rect x="18" y="18" width="2" height="2" fill="#00ff66" opacity="0.5"/>
        </svg>
    </div>

    <div class="vignette"></div>

    <div class="terminal-container">
        <div class="terminal-header">
            <h1>C.R.I.S. v4.1.3</h1>
            <div class="status-dot"></div>
        </div>
        
        <div class="terminal-body">
            <div class="sub-header">
                CENTRAL DE RECONHECIMENTO E INTELIGÊNCIA<br>
                AUTENTICAÇÃO OBRIGATÓRIA
            </div>

            <div class="input-group">
                <label for="agente">> ID DE AGENTE:</label>
                <input type="text" id="agente" placeholder="agente_0413" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="senha">> CHAVE DE ACESSO:</label>
                <input type="password" id="senha">
            </div>

            <button id="btn-acessar" onclick="fazerLogin()">[ AUTENTICAR ]</button>
            <div class="msg-status" id="msg-status"></div>
        </div>

        <div class="footer-note">
            PROPRIEDADE RESTRITA DA ORDO REALITAS.<br>
            ACESSO NÃO AUTORIZADO É CRIME.
        </div>
    </div>

    <script src="app.js"></script>

    <!-- Script leve para o cursor customizado acompanhar o ponteiro -->
    <script>
        const cursor = document.getElementById('glitch-cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        });
    </script>
</body>
</html>
