<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.R.I.S. - TERMINAL DE ACESSO</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cris-green: #00ff66;
            --cris-glow: rgba(0, 255, 102, 0.4);
            --cris-dark: #080d0a;
            --cris-panel: #0d1712;
            --cris-border: #1b3d29;
        }

        /* Ponteiro Personalizado Verde Neon Pixelizado (SVG inline nativo) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges"><path fill="%2300ff66" stroke="%23000" stroke-width="1" d="M0 0v16l4-4 3 7 3-1-3-7 6 0z"/></svg>'), auto !important;
        }

        body {
            background-color: var(--cris-dark);
            color: var(--cris-green);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Efeito CRT - Textura de Linhas na Tela Inteira */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Vignette nos Cantos */
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.9) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* Terminal Container com Glitch e Textura em Rolagem Infinita */
        .terminal-container {
            width: 420px;
            background: var(--cris-panel);
            border: 2px solid var(--cris-green);
            box-shadow: 0 0 25px var(--cris-glow), inset 0 0 15px rgba(0,255,102,0.1);
            border-radius: 4px;
            z-index: 2;
            position: relative;
            overflow: hidden;

            /* Animação de Glitch no Contêiner */
            animation: periodicGlitch 6s infinite ease-in-out;
        }

        /* Overlay de Textura Deslizante (Rolagem Infinita dos Pixels/Linhas) */
        .terminal-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 255, 102, 0.08) 3px,
                rgba(0, 0, 0, 0.25) 4px
            );
            background-size: 100% 8px;
            pointer-events: none;
            z-index: 8;

            /* Loop Infinito Deslocando a Textura de Baixo para Cima */
            animation: scrollTexture 1.5s linear infinite;
        }

        /* Animação: Rolagem Contínua de Textura Holográfica */
        @keyframes scrollTexture {
            0% {
                background-position-y: 0px;
            }
            100% {
                background-position-y: 32px; /* Múltiplo do tamanho do gradiente */
            }
        }

        /* Animação: Glitch Periódico de Sinal */
        @keyframes periodicGlitch {
            0%, 93%, 100% {
                transform: translate(0, 0) skew(0deg);
                filter: none;
            }
            94% {
                transform: translate(-3px, 1px) skew(-1deg);
                filter: drop-shadow(2px -2px 0px rgba(0, 255, 102, 0.8));
            }
            95% {
                transform: translate(3px, -2px) skew(1.5deg);
                filter: drop-shadow(-2px 2px 0px rgba(255, 0, 80, 0.5));
            }
            96% {
                transform: translate(-1px, 2px) skew(-0.5deg);
                filter: none;
            }
            97% {
                transform: translate(0, 0) skew(0deg);
            }
        }

        .terminal-header {
            background: rgba(0, 255, 102, 0.15);
            border-bottom: 2px solid var(--cris-green);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
            position: relative;
            z-index: 3;
        }

        .terminal-header h1 {
            font-size: 1.1rem;
            text-shadow: 0 0 8px var(--cris-glow);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--cris-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cris-green);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .terminal-body {
            padding: 30px 25px;
            position: relative;
            z-index: 3;
        }

        .sub-header {
            font-size: 0.85rem;
            color: #7baf92;
            margin-bottom: 25px;
            border-left: none;
            padding-left: 0;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--cris-border);
            border-left: 3px solid var(--cris-green);
            color: #fff;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--cris-green);
            box-shadow: 0 0 10px var(--cris-glow);
        }

        button {
            width: 100%;
            background: var(--cris-green);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            font-family: inherit;
            letter-spacing: 2px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        .msg-status {
            margin-top: 15px;
            font-size: 0.85rem;
            min-height: 20px;
            text-align: center;
        }

        .footer-note {
            border-top: 1px solid var(--cris-border);
            padding: 10px;
            font-size: 0.7rem;
            color: #4a755d;
            text-align: center;
            position: relative;
            z-index: 3;
        }
    </style>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="vignette"></div>

    <div class="terminal-container">
        <div class="terminal-header">
            <h1>C.R.I.S. v4.1.3</h1>
            <div class="status-dot"></div>
        </div>
        
        <div class="terminal-body">
            <div class="sub-header">
                CENTRAL DE RECONHECIMENTO E INTELIGÊNCIA<br>
                AUTENTICAÇÃO OBRIGATÓRIA
            </div>

            <div class="input-group">
                <label for="agente">> ID DE AGENTE:</label>
                <input type="text" id="agente" placeholder="agente_0413" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="senha">> CHAVE DE ACESSO:</label>
                <input type="password" id="senha">
            </div>

            <button id="btn-acessar" onclick="fazerLogin()">[ AUTENTICAR ]</button>
            <div class="msg-status" id="msg-status"></div>
        </div>

        <div class="footer-note">
            PROPRIEDADE RESTRITA DA ORDO REALITAS.<br>
            ACESSO NÃO AUTORIZADO É CRIME.
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
