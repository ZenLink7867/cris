<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE INTELIGÊNCIA - RESTRITO</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            border: 2px solid #00ff66;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
            text-align: center;
        }
        input {
            background: #1a1a1a;
            border: 1px solid #00ff66;
            color: #fff;
            padding: 10px;
            margin: 10px 0;
            width: 80%;
            font-family: inherit;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>TERMINAL DE ACESSO RESTRITO</h2>
        <p>DIGITE SUAS CREDENCIAIS DE AGENTE</p>
        <input type="text" id="agente" placeholder="CÓDIGO DE AGENTE"><br>
        <input type="password" id="senha" placeholder="SENHA"><br>
        <button onclick="alert('Sistema em fase de teste!')">ENTRAR</button>
    </div>
</body>
</html>
